[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pypowdr"
version = "0.1.0"
description = "Python tools for automated full pattern summation (FPS) analysis of X-ray powder diffraction data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Yi Xiang", email = "ybx5215@psu.edu"},
    {name = "Jonathan Smith", email = "jjs6995@psu.edu"},
]
keywords = [
    "xrd",
    "x-ray diffraction",
    "quantitative mineralogy",
    "full pattern summation",
    "geochemistry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/yiiiiiiiiix/Pypowdr"
Repository = "https://github.com/yiiiiiiiiix/Pypowdr"
Issues = "https://github.com/yiiiiiiiiix/Pypowdr/issues"

[tool.setuptools.packages.find]
include = ["Powdr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
